name: Deploy to Cloud Run

# Auto-deploy on every push to main; also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
    # Skip the build+deploy for pushes that CANNOT change the shipped image —
    # the same paths .dockerignore already excludes from the build context.
    # terraform/ and functions/ deploy via local `terraform apply`, not CI.
    # A mixed push still runs (skipped only if EVERY file matches), and
    # workflow_dispatch stays as the manual escape hatch.
    paths-ignore:
      - "terraform/**"
      - "functions/**"
      - "**.md"
  workflow_dispatch:

# One deploy per branch at a time. A newer push cancels an in-flight run so
# production always converges to the latest commit — without this, two overlapping
# runs could finish out of order and an older run could overwrite newer with an
# older image. (Cloud Run revisions are created/switched atomically, so cancelling
# a run mid-deploy is safe.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default GITHUB_TOKEN for every job: the quality job only reads
# the repo. If a compromised third-party action ever runs here, the token it can
# steal is read-only. The deploy job declares its own block (adding id-token for
# WIF), which replaces — not extends — this one.
permissions:
  contents: read

env:
  PROJECT_ID: albert-blog-2606221144
  REGION: asia-east1
  SERVICE: blog
  IMAGE: asia-east1-docker.pkg.dev/albert-blog-2606221144/blog/blog

jobs:
  # Quality gate: lint + type-check + tests must pass before we build and deploy.
  quality:
    runs-on: ubuntu-latest
    # Normal run is well under a minute; this only exists to kill a hung job long
    # before the GitHub default of 6h (it does not constrain a healthy run).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Enable corepack first so pnpm is on PATH before setup-node: v5 inspects the
      # packageManager field + pnpm cache and errors if pnpm isn't found yet.
      - name: Enable pnpm
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # A 1-second syntax gate for the Cloud Function (it has no build step of
      # its own; a syntax error would otherwise surface only when a deploy's
      # startup health check fails). Note functions-only pushes skip CI entirely
      # (paths-ignore above) — there, `terraform apply` is the backstop.
      - name: Function syntax check
        run: node --check functions/alert-to-discord/index.js

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # Normal run is ~2m (build + push + deploy); generous headroom, still well
    # under the 6h default so a hang is caught early.
    timeout-minutes: 15
    permissions:
      contents: read # checkout the repo
      id-token: write # REQUIRED: lets the runner mint the GitHub OIDC token for WIF

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Exchange GitHub's short-lived OIDC token for a ~1h GCP token. No JSON keys.
      # The two inputs below come from repo Actions Variables that Terraform sets
      # from the WIF provider name + deployer SA email (see terraform/github.tf).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Wire docker's auth to the token from the auth step so it can push to AR.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # Runner is amd64 Linux, so a plain build is already the arch Cloud Run wants
      # (no --platform / QEMU like we needed locally on Apple Silicon).
      # Tag with the commit SHA for traceable, immutable deploys, plus moving 'latest'.
      - name: Build image
        run: docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .

      - name: Push image
        run: docker push --all-tags "$IMAGE"

      # Deploy the SHA-tagged image. We deliberately don't pass --allow-unauthenticated:
      # an image update leaves the existing public invoker binding untouched, and the
      # deployer SA has no IAM-admin rights to change it anyway.
      #
      # Service config (scaling/--max-instances, env, resources) is now owned by
      # Terraform (terraform/cloudrun.tf); this step only swaps the image, and the
      # Terraform service ignores image changes so the deploy isn't seen as drift.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --quiet
